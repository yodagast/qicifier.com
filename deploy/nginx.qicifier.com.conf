# qicifier.com 的 nginx 参考配置
#
# ⚠️ 这份文件**不在部署链路上**：线上跑的是服务器上那份 nginx conf，
# 本仓库只保存一份「应该长什么样」，改完要人工同步到服务器并 `nginx -s reload`。
# 放在仓库里的理由：审计（2026-10-28）发现的四个 P0 问题里有三个（robots 被 SPA
# 兜底吃掉、sitemap 返回 HTML、不存在路径返回 200）**只改代码修不好**，
# 而配置只存在于某台机器上，下一次重装就该重新踩一遍。
#
# 上线后按这个顺序验收（全部期望写在注释里）：
#   curl -sI  https://qicifier.com/robots.txt   → Content-Type: text/plain
#   curl -s   https://qicifier.com/sitemap.xml  → <?xml version="1.0" …
#   curl -s   https://qicifier.com/research/<slug> | grep -o '<h1[^>]*>'  → 正文已预渲染
#   curl -s   https://qicifier.com/clusters/415X-人工智能 | grep -o '<title>[^<]*'
#                                              → <title>人工智能 · 杭州波动粒子
#   curl -s -o /dev/null -w '%{http_code}\n' https://qicifier.com/clusters/not-exist-xyz
#                                              → 404
#   curl -sI -H 'Accept-Encoding: gzip' https://qicifier.com/assets/index-*.js \
#        | grep -i content-encoding           → Content-Encoding: gzip

server {
    listen 80;
    server_name qicifier.com www.qicifier.com;
    return 301 https://qicifier.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qicifier.com;

    ssl_certificate     /etc/letsencrypt/live/qicifier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qicifier.com/privkey.pem;

    # 前端构建产物（npm run build + tools/prerender.py 之后才有内容）
    root /srv/qicifier/dist;
    index index.html;

    # ① 压缩：审计实测 211KB 的 JS 是裸传的（无 Content-Encoding）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # ② robots.txt / sitemap.xml 必须命中真实响应，不能被 SPA 兜底接住。
    #    robots 是构建产物里的静态文件（frontend/public/robots.txt）；
    #    sitemap 由后端按库生成（集群增删后自动跟着变，静态文件会过期）。
    location = /robots.txt  { try_files /robots.txt =404; }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5172;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ③ 行业研究是**站点自己的路由**（正文由 /api/research/<slug> 取回后嵌在页面里），
    #    不要给它加 proxy_pass —— 反代会让线上没有页头页脚，而本地（vite）是正常的，
    #    这种「只有线上坏」的差异最难查。
    #
    #    但它是**会随后台导入变化**的目录：预渲染产物存在时直接命中（收录引擎拿到正文），
    #    新导入的文章在下次 `npm run build:seo` 之前没有产物，退回列表页骨架让 SPA
    #    渲染正文 —— 否则「导入即生效」在线上会变成 404。
    location = /research {
        try_files /research/index.html =404;
    }

    location ^~ /research/ {
        try_files $uri $uri/index.html /research/index.html =404;
    }

    # ④ 纯交互路由仍走 SPA，但不参与排名
    location ~ ^/(login|favorites|admin)(/|$) {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5172;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 灌库 / 名单导入要跑一分钟以上，默认 60s 会在中途 504
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # 带内容哈希的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ⑤ 其余必须命中**预渲染产物**，否则真 404。
    #    tools/prerender.py 把每页写成 dist/<path>/index.html。
    #    顺序把 `$uri/index.html` 放第一位是刻意的：sitemap 里的集群 URL 没有结尾斜杠，
    #    先命中产物就不会触发 nginx「目录 → 补斜杠 → 301」，canonical 与最终 URL 才一致。
    #    不存在时返回 404（以前是 200 + 空白 SPA = 软 404，搜索引擎会把无限路径都当有效页）。
    location / {
        try_files $uri/index.html $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }
}
